
name: Python Hello World CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Python App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install testing dependency
        run: python -m pip install pytest

      - name: Build - Compile Python files
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m pytest -v

      - name: Run Hello World application
        run: python hello.py


            