name: Python Hello World CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# GitHub repository variables
env:
  APP_NAME: ${{ vars.APP_NAME }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT }}

jobs:
  build-and-test:
    name: Build, Lint, Test and Code Coverage
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Read GitHub Variables
      - name: Display application configuration
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $ENVIRONMENT"

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pylint

      # Step 5: Run Pylint quality gate
      - name: Analyze Python code with Pylint
        run: |
          python -m pylint --fail-under=8.0 hello.py

      # Step 6: Compile Python files
      - name: Compile Python files
        run: |
          python -m compileall -q .

      # Step 7: Run tests and generate coverage report
      - name: Run Python tests with coverage
        run: |
          python -m pytest -v \
            --cov=hello \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # Step 8: Run Python application
      - name: Run Python application
        run: |
          python hello.py

      # Step 9: Check whether GitHub Secret is configured
      - name: Check API token configuration
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -n "$API_TOKEN" ]; then
            echo "API_TOKEN is configured."
          else
            echo "API_TOKEN is not configured."
          fi

      # Step 10: Upload coverage report
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml
          if-no-files-found: ignore
