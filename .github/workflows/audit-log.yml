
# Python Audit Log Workflow with Quality Gates and Diagnostics
name: Python Audit Log Workflow

# Run the audit on code changes, pull requests, releases, CI completion,
# deployment status changes, or manual execution.
on:
  push:
    branches:
      - main
      - master
      - release
      - 'feature/**'

  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

  release:
    types: [published]

  # The workflow name must match the Python CI workflow exactly.
  # This trigger requires this audit workflow to exist on the default branch.
  workflow_run:
    workflows: ["Python Hello World CI"]
    types: [completed]

  deployment_status:

  workflow_dispatch:
    inputs:
      wave_id:
        description: "Deployment wave ID"
        required: false
        type: string
      region:
        description: "Deployment region"
        required: false
        type: string
      environment:
        description: "Deployment environment"
        required: false
        type: string
      artifact_version:
        description: "Artifact version"
        required: false
        type: string
      terraform_plan_result:
        description: "Terraform plan result"
        required: false
        type: string
      terraform_apply_result:
        description: "Terraform apply result"
        required: false
        type: string
      approval_details:
        description: "Approval details"
        required: false
        type: string

# Read-only permissions for repository, workflow, and deployment data.
permissions:
  contents: read
  actions: read
  deployments: read
  pull-requests: read

jobs:
  audit:
    name: Python Quality Gates and Audit
    runs-on: ubuntu-latest

    steps:
      # Check out the commit associated with the triggering event.
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Install Python for the quality checks and audit scripts.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install pytest, coverage reporting, and Pylint.
      - name: Install Python quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pylint

      # QUALITY GATE 1:
      # Require a Pylint score of at least 8.0/10.
      # Preserve the job temporarily on failure so diagnostics and audit reports run.
      - name: Run Pylint quality gate
        id: pylint_gate
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pylint hello.py --score=yes --fail-under=8.0 2>&1 | tee pylint-report.txt

      # Show a GitHub error annotation if Pylint fails.
      - name: Annotate Pylint failure
        if: steps.pylint_gate.outcome == 'failure'
        run: |
          echo "::error title=Pylint Quality Gate Failed::Pylint failed or the score is below 8.0/10. Review pylint-report.txt."

      # QUALITY GATE 2:
      # Run tests, produce coverage.xml, and require at least 80% line coverage.
      - name: Run pytest coverage quality gate
        id: coverage_gate
        continue-on-error: true
        run: |
          python -m pytest -v \
            --cov=hello \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80

      # Highlight test failures or insufficient coverage.
      - name: Annotate coverage failure
        if: steps.coverage_gate.outcome == 'failure'
        run: |
          echo "::error title=Coverage Quality Gate Failed::Tests failed, no tests were collected, or coverage is below 80%. Review the pytest logs."

      # DIAGNOSTICS:
      # Display the generated coverage percentage and report availability.
      # This step runs even when pytest fails.
      - name: Diagnose Python coverage failure
        if: always()
        run: |
          echo "Checking pytest coverage output..."

          if [ -f coverage.xml ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("coverage.xml").getroot()
              line_rate = root.attrib.get("line-rate")
              if line_rate is None:
                  print("::warning title=Coverage Data Missing::coverage.xml has no line-rate value.")
              else:
                  coverage = float(line_rate) * 100
                  print(f"Measured coverage: {coverage:.2f}%")
                  if coverage < 80:
                      print("::warning title=Coverage Below Threshold::Coverage is below the required 80%.")
          except (ET.ParseError, ValueError) as exc:
              print(f"::error title=Invalid Coverage Report::{exc}")
          PY
          else
            echo "::warning title=Coverage Report Missing::coverage.xml was not generated. Check test collection, imports, and pytest errors."
          fi

          if [ -f pylint-report.txt ]; then
            echo "Pylint report:"
            cat pylint-report.txt
          else
            echo "::warning title=Pylint Report Missing::pylint-report.txt was not generated."
          fi

      # Generate a structured JSON audit record using Python.
      # Record actual quality-gate outcomes and any report values that exist.
      - name: Generate audit record
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_PATH: ${{ github.event_path }}
          PYLINT_OUTCOME: ${{ steps.pylint_gate.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage_gate.outcome }}
          WAVE_ID: ${{ inputs.wave_id }}
          REGION: ${{ inputs.region }}
          ENVIRONMENT: ${{ inputs.environment }}
          ARTIFACT_VERSION: ${{ inputs.artifact_version }}
          TERRAFORM_PLAN_RESULT: ${{ inputs.terraform_plan_result }}
          TERRAFORM_APPLY_RESULT: ${{ inputs.terraform_apply_result }}
          APPROVAL_DETAILS: ${{ inputs.approval_details }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          # Read GitHub event metadata when available.
          payload = {}
          event_path = os.getenv("EVENT_PATH", "")
          if event_path and Path(event_path).exists():
              with open(event_path, encoding="utf-8") as f:
                  payload = json.load(f)

          # Extract the Pylint score from the captured report.
          pylint_score = None
          pylint_report = Path("pylint-report.txt")
          if pylint_report.exists():
              match = re.search(
                  r"Your code has been rated at\s+(-?[\d.]+)/10",
                  pylint_report.read_text(encoding="utf-8", errors="replace")
              )
              if match:
                  pylint_score = float(match.group(1))

          # Extract line coverage from coverage.xml when it exists.
          coverage_percent = None
          coverage_report = Path("coverage.xml")
          if coverage_report.exists():
              try:
                  root = ET.parse(coverage_report).getroot()
                  rate = root.attrib.get("line-rate")
                  if rate is not None:
                      coverage_percent = round(float(rate) * 100, 2)
              except (ET.ParseError, ValueError):
                  pass

          # Mark a gate as passed only if its command succeeded and the
          # expected measurement is available and meets the configured threshold.
          pylint_outcome = os.getenv("PYLINT_OUTCOME", "unknown")
          coverage_outcome = os.getenv("COVERAGE_OUTCOME", "unknown")

          pylint_passed = (
              pylint_outcome == "success"
              and pylint_score is not None
              and pylint_score >= 8.0
          )
          coverage_passed = (
              coverage_outcome == "success"
              and coverage_percent is not None
              and coverage_percent >= 80.0
          )
          quality_passed = pylint_passed and coverage_passed

          pr = payload.get("pull_request") or {}
          release = payload.get("release") or {}
          source_run = payload.get("workflow_run") or {}
          deployment = payload.get("deployment") or {}
          deployment_status = payload.get("deployment_status") or {}

          run_url = (
              f"{os.getenv('SERVER_URL')}/{os.getenv('REPOSITORY')}"
              f"/actions/runs/{os.getenv('RUN_ID')}"
          )

          audit = {
              "audit_timestamp": datetime.now(timezone.utc).isoformat(),
              "repository": os.getenv("REPOSITORY"),
              "event_name": os.getenv("EVENT_NAME"),
              "actor": os.getenv("ACTOR"),
              "workflow_name": os.getenv("WORKFLOW_NAME"),
              "run_id": os.getenv("RUN_ID"),
              "run_number": os.getenv("RUN_NUMBER"),
              "run_attempt": os.getenv("RUN_ATTEMPT"),
              "run_url": run_url,
              "ref": os.getenv("REF"),
              "commit_sha": os.getenv("SHA"),

              "pull_request": {
                  "number": pr.get("number"),
                  "title": pr.get("title"),
                  "merged": pr.get("merged"),
                  "merge_commit_sha": pr.get("merge_commit_sha"),
                  "url": pr.get("html_url"),
              } if pr else None,

              "release": {
                  "tag": release.get("tag_name"),
                  "published_at": release.get("published_at"),
                  "url": release.get("html_url"),
              } if release else None,

              "source_workflow": {
                  "name": source_run.get("name"),
                  "run_id": source_run.get("id"),
                  "head_branch": source_run.get("head_branch"),
                  "head_sha": source_run.get("head_sha"),
                  "conclusion": source_run.get("conclusion"),
                  "url": source_run.get("html_url"),
              } if source_run else None,

              "deployment": {
                  "environment": (
                      os.getenv("ENVIRONMENT") or deployment.get("environment")
                  ),
                  "region": os.getenv("REGION") or None,
                  "deployment_id": deployment.get("id"),
                  "status": deployment_status.get("state"),
                  "created_at": deployment.get("created_at"),
                  "status_timestamp": deployment_status.get("created_at"),
              },

              "release_traceability": {
                  "wave_id": os.getenv("WAVE_ID") or None,
                  "artifact_version": (
                      os.getenv("ARTIFACT_VERSION")
                      or release.get("tag_name")
                      or None
                  ),
                  "commit_sha": os.getenv("SHA"),
              },

              "approvals": {
                  "supplied_details": os.getenv("APPROVAL_DETAILS") or None,
                  "note": (
                      "Supplied details are not independently verified. "
                      "Retrieve actual approval records from GitHub."
                  ),
              },

              "testing_and_quality": {
                  "pylint": {
                      "outcome": pylint_outcome,
                      "score": pylint_score,
                      "minimum_score": 8.0,
                      "quality_gate": "passed" if pylint_passed else "failed",
                  },
                  "pytest_coverage": {
                      "outcome": coverage_outcome,
                      "coverage_percent": coverage_percent,
                      "minimum_percent": 80.0,
                      "quality_gate": "passed" if coverage_passed else "failed",
                  },
                  "overall_quality_gate": (
                      "passed" if quality_passed else "failed"
                  ),
              },

              "infrastructure": {
                  "terraform_plan_result": (
                      os.getenv("TERRAFORM_PLAN_RESULT") or None
                  ),
                  "terraform_apply_result": (
                      os.getenv("TERRAFORM_APPLY_RESULT") or None
                  ),
              },

              "final_outcome": (
                  "quality-gates-passed" if quality_passed
                  else "quality-gates-failed"
              ),
          }

          # Save the audit data even if a quality gate fails.
          with open("audit-log.json", "w", encoding="utf-8") as f:
              json.dump(audit, f, indent=2)

          print("::notice title=Audit Record::audit-log.json generated.")

          if not pylint_passed:
              print("::warning title=Pylint Gate Failed::Check the score and pylint-report.txt.")

          if not coverage_passed:
              print("::warning title=Coverage Gate Failed::Check test results and coverage.xml.")

          if quality_passed:
              print("::notice title=Quality Gates Passed::Pylint and coverage meet their thresholds.")
          else:
              print("::error title=Quality Gates Failed::At least one required quality gate did not pass.")
          PY

      # Publish a readable summary on the workflow run page.
      - name: Publish quality gate summary
        if: always()
        env:
          PYLINT_OUTCOME: ${{ steps.pylint_gate.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage_gate.outcome }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # Read measured Pylint score if the report exists.
          pylint_score = "unavailable"
          path = Path("pylint-report.txt")
          if path.exists():
              match = re.search(
                  r"Your code has been rated at\s+(-?[\d.]+)/10",
                  path.read_text(encoding="utf-8", errors="replace")
              )
              if match:
                  pylint_score = match.group(1) + "/10"

          # Read measured coverage percentage if the report exists.
          coverage = "unavailable"
          path = Path("coverage.xml")
          if path.exists():
              try:
                  root = ET.parse(path).getroot()
                  coverage = f"{float(root.attrib['line-rate']) * 100:.2f}%"
              except (ET.ParseError, KeyError, ValueError):
                  pass

          print("# Python Quality Gate Summary\n")
          print("| Check | Command outcome | Measurement | Required |")
          print("|---|---|---:|---:|")
          print(f"| Pylint | {os.getenv('PYLINT_OUTCOME')} | {pylint_score} | 8.0/10 |")
          print(f"| Pytest coverage | {os.getenv('COVERAGE_OUTCOME')} | {coverage} | 80% |")
          PY

      # Upload audit and quality reports even when a gate fails.
      - name: Upload audit and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-audit-${{ github.run_id }}
          path: |
            audit-log.json
            pylint-report.txt
            coverage.xml
          if-no-files-found: warn
          retention-days: 90

      # Final enforcement:
      # Earlier quality-check steps preserve their reports on failure.
      # This step makes the overall job fail if either required gate fails.
      - name: Enforce quality gates
        if: always()
        env:
          PYLINT_OUTCOME: ${{ steps.pylint_gate.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage_gate.outcome }}
        run: |
          if [ "$PYLINT_OUTCOME" != "success" ]; then
            echo "::error title=Pylint Gate Failed::Pylint did not pass. Review the report and earlier logs."
            exit 1
          fi

          if [ "$COVERAGE_OUTCOME" != "success" ]; then
            echo "::error title=Coverage Gate Failed::Tests failed or coverage is below 80%. Review the diagnostic output."
            exit 1
          fi

          echo "::notice title=Quality Gates Passed::Pylint and coverage passed."
