
# Python Audit Log Workflow with Pylint, Coverage, and Quality Gates
name: Python Audit Log Workflow

# Trigger the audit on code changes, pull requests, releases,
# completion of Python CI, deployment status changes, or manual execution.
on:
  push:
    branches:
      - main
      - master
      - release
      - 'feature/**'

  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

  release:
    types: [published]

  workflow_run:
    workflows: ["Python Hello World CI"]
    types: [completed]

  deployment_status:

  workflow_dispatch:
    inputs:
      wave_id:
        description: "Deployment wave ID"
        required: false
        type: string
      region:
        description: "Deployment region"
        required: false
        type: string
      environment:
        description: "Deployment environment"
        required: false
        type: string
      artifact_version:
        description: "Artifact version"
        required: false
        type: string
      terraform_plan_result:
        description: "Terraform plan result"
        required: false
        type: string
      terraform_apply_result:
        description: "Terraform apply result"
        required: false
        type: string
      approval_details:
        description: "Approval details"
        required: false
        type: string

# Allow read-only access to repository, workflow, and deployment information.
permissions:
  contents: read
  actions: read
  deployments: read
  pull-requests: read

jobs:
  audit:
    name: Python Quality Gates and Audit
    runs-on: ubuntu-latest

    steps:
      # Check out the commit associated with the event.
      # For workflow_run events, use the source CI commit.
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Install the Python version used for quality checks.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install the test, coverage, and static-analysis tools.
      - name: Install Python quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pylint

      # QUALITY GATE 1:
      # Require a Pylint score of at least 8.0 out of 10.
      # continue-on-error allows the audit record to be created even on failure.
      - name: Run Pylint quality gate
        id: pylint_gate
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pylint hello.py \
            --score=yes \
            --fail-under=8.0 2>&1 | tee pylint-report.txt

      # Display a GitHub annotation when Pylint fails.
      - name: Annotate Pylint result
        if: steps.pylint_gate.outcome == 'failure'
        run: |
          echo "::error title=Pylint Quality Gate Failed::Pylint failed or its score is below 8.0/10. Review pylint-report.txt."

      # QUALITY GATE 2:
      # Run tests, generate coverage.xml, and require at least 80% coverage.
      # Replace hello with your actual Python module name if needed.
      - name: Run pytest coverage quality gate
        id: coverage_gate
        continue-on-error: true
        run: |
          python -m pytest -v \
            --cov=hello \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80

      # Display a GitHub annotation when tests fail or coverage is below 80%.
      - name: Annotate coverage result
        if: steps.coverage_gate.outcome == 'failure'
        run: |
          echo "::error title=Test Coverage Quality Gate Failed::Tests failed or coverage is below 80%. Review the pytest output."

      # Generate the audit JSON using Python, not Node.js.
      # Record actual step outcomes and read the reports for score and coverage.
      - name: Generate audit record
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_PATH: ${{ github.event_path }}
          PYLINT_OUTCOME: ${{ steps.pylint_gate.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage_gate.outcome }}
          WAVE_ID: ${{ inputs.wave_id }}
          REGION: ${{ inputs.region }}
          ENVIRONMENT: ${{ inputs.environment }}
          ARTIFACT_VERSION: ${{ inputs.artifact_version }}
          TERRAFORM_PLAN_RESULT: ${{ inputs.terraform_plan_result }}
          TERRAFORM_APPLY_RESULT: ${{ inputs.terraform_apply_result }}
          APPROVAL_DETAILS: ${{ inputs.approval_details }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          def read_event():
              event_path = os.getenv("EVENT_PATH", "")
              if event_path and Path(event_path).exists():
                  with open(event_path, encoding="utf-8") as f:
                      return json.load(f)
              return {}

          def get_pylint_score():
              report = Path("pylint-report.txt")
              if not report.exists():
                  return None
              content = report.read_text(encoding="utf-8", errors="replace")
              match = re.search(
                  r"Your code has been rated at\s+(-?[\d.]+)/10",
                  content
              )
              return float(match.group(1)) if match else None

          def get_coverage():
              report = Path("coverage.xml")
              if not report.exists():
                  return None
              try:
                  root = ET.parse(report).getroot()
                  line_rate = root.attrib.get("line-rate")
                  return round(float(line_rate) * 100, 2) if line_rate else None
              except (ET.ParseError, ValueError):
                  return None

          payload = read_event()
          pr = payload.get("pull_request") or {}
          release = payload.get("release") or {}
          source_run = payload.get("workflow_run") or {}
          deployment = payload.get("deployment") or {}
          deployment_status = payload.get("deployment_status") or {}

          pylint_outcome = os.getenv("PYLINT_OUTCOME", "unknown")
          coverage_outcome = os.getenv("COVERAGE_OUTCOME", "unknown")
          pylint_score = get_pylint_score()
          coverage_percent = get_coverage()

          # Mark each gate according to its configured threshold and actual result.
          pylint_passed = (
              pylint_outcome == "success"
              and pylint_score is not None
              and pylint_score >= 8.0
          )
          coverage_passed = (
              coverage_outcome == "success"
              and coverage_percent is not None
              and coverage_percent >= 80.0
          )

          quality_passed = pylint_passed and coverage_passed

          run_url = (
              f"{os.getenv('SERVER_URL')}/{os.getenv('REPOSITORY')}"
              f"/actions/runs/{os.getenv('RUN_ID')}"
          )

          audit = {
              "audit_timestamp": datetime.now(timezone.utc).isoformat(),
              "repository": os.getenv("REPOSITORY"),
              "event_name": os.getenv("EVENT_NAME"),
              "actor": os.getenv("ACTOR"),
              "workflow_name": os.getenv("WORKFLOW_NAME"),
              "run_id": os.getenv("RUN_ID"),
              "run_number": os.getenv("RUN_NUMBER"),
              "run_attempt": os.getenv("RUN_ATTEMPT"),
              "run_url": run_url,
              "ref": os.getenv("REF"),
              "commit_sha": os.getenv("SHA"),

              "pull_request": {
                  "number": pr.get("number"),
                  "title": pr.get("title"),
                  "merged": pr.get("merged"),
                  "merge_commit_sha": pr.get("merge_commit_sha"),
                  "url": pr.get("html_url"),
              } if pr else None,

              "release": {
                  "tag": release.get("tag_name"),
                  "published_at": release.get("published_at"),
                  "url": release.get("html_url"),
              } if release else None,

              "source_workflow": {
                  "name": source_run.get("name"),
                  "run_id": source_run.get("id"),
                  "head_branch": source_run.get("head_branch"),
                  "head_sha": source_run.get("head_sha"),
                  "conclusion": source_run.get("conclusion"),
                  "url": source_run.get("html_url"),
              } if source_run else None,

              "deployment": {
                  "environment": (
                      os.getenv("ENVIRONMENT")
                      or deployment.get("environment")
                  ),
                  "region": os.getenv("REGION") or None,
                  "deployment_id": deployment.get("id"),
                  "status": deployment_status.get("state"),
                  "created_at": deployment.get("created_at"),
                  "status_timestamp": deployment_status.get("created_at"),
              },

              "release_traceability": {
                  "wave_id": os.getenv("WAVE_ID") or None,
                  "artifact_version": (
                      os.getenv("ARTIFACT_VERSION")
                      or release.get("tag_name")
                      or None
                  ),
                  "commit_sha": os.getenv("SHA"),
              },

              "approvals": {
                  "supplied_details": os.getenv("APPROVAL_DETAILS") or None,
                  "note": (
                      "Supplied details are not independently verified. "
                      "Retrieve actual approver records from GitHub."
                  ),
              },

              "testing_and_quality": {
                  "pylint": {
                      "outcome": pylint_outcome,
                      "score": pylint_score,
                      "minimum_score": 8.0,
                      "quality_gate": "passed" if pylint_passed else "failed",
                  },
                  "pytest_coverage": {
                      "outcome": coverage_outcome,
                      "coverage_percent": coverage_percent,
                      "minimum_percent": 80.0,
                      "quality_gate": (
                          "passed" if coverage_passed else "failed"
                      ),
                  },
                  "overall_quality_gate": (
                      "passed" if quality_passed else "failed"
                  ),
              },

              "infrastructure": {
                  "terraform_plan_result": (
                      os.getenv("TERRAFORM_PLAN_RESULT") or None
                  ),
                  "terraform_apply_result": (
                      os.getenv("TERRAFORM_APPLY_RESULT") or None
                  ),
              },

              "final_outcome": (
                  "quality-gates-passed"
                  if quality_passed
                  else "quality-gates-failed"
              ),
          }

          # Write the JSON audit artifact for review and retention.
          with open("audit-log.json", "w", encoding="utf-8") as f:
              json.dump(audit, f, indent=2)

          print("::notice title=Audit Record::audit-log.json generated.")

          if not pylint_passed:
              print("::warning title=Pylint Gate::Pylint quality gate did not pass.")

          if not coverage_passed:
              print("::warning title=Coverage Gate::Coverage quality gate did not pass.")

          if quality_passed:
              print("::notice title=Quality Gates Passed::Pylint and coverage meet their thresholds.")
          else:
              print("::error title=Quality Gates Failed::At least one quality gate failed.")
          PY

      # Publish a summary visible on the Actions run page.
      - name: Publish quality gate summary
        if: always()
        env:
          PYLINT_OUTCOME: ${{ steps.pylint_gate.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage_gate.outcome }}
        run: |
          # Read measured values from reports and show them in the summary.
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          print("# Python Quality Gate Summary\n")
          print("| Check | Result | Measured value | Threshold |")
          print("|---|---|---:|---:|")

          pylint_score = "unavailable"
          report = Path("pylint-report.txt")
          if report.exists():
              match = re.search(
                  r"Your code has been rated at\s+(-?[\d.]+)/10",
                  report.read_text(encoding="utf-8", errors="replace")
              )
              if match:
                  pylint_score = match.group(1) + "/10"

          coverage = "unavailable"
          report = Path("coverage.xml")
          if report.exists():
              try:
                  root = ET.parse(report).getroot()
                  coverage = f"{float(root.attrib['line-rate']) * 100:.2f}%"
              except (ET.ParseError, KeyError, ValueError):
                  pass

          print(f"| Pylint | {__import__('os').environ.get('PYLINT_OUTCOME')} | {pylint_score} | 8.0/10 |")
          print(f"| Pytest coverage | {__import__('os').environ.get('COVERAGE_OUTCOME')} | {coverage} | 80% |")
          PY

      # Upload audit and quality reports even if a quality gate fails.
      - name: Upload audit and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-audit-${{ github.run_id }}
          path: |
            audit-log.json
            pylint-report.txt
            coverage.xml
          if-no-files-found: warn
          retention-days: 90

      # ENFORCE THE QUALITY GATES:
      # Earlier steps use continue-on-error so reports can still be generated.
      # This final step fails the job if either quality check failed.
      - name: Enforce quality gates
        if: always()
        env:
          PYLINT_OUTCOME: ${{ steps.pylint_gate.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage_gate.outcome }}
        run: |
          if [ "$PYLINT_OUTCOME" != "success" ]; then
            echo "::error title=Pylint Gate Failed::Required Pylint quality gate did not pass."
            exit 1
          fi

          if [ "$COVERAGE_OUTCOME" != "success" ]; then
            echo "::error title=Coverage Gate Failed::Required test coverage quality gate did not pass."
            exit 1
          fi

          echo "::notice title=Quality Gates Passed::Pylint score and test coverage meet the required thresholds."
