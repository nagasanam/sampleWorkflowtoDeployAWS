
# ============================================================
# GitHub Actions Audit Log
# ============================================================
name: GitHub Actions Audit Log

# ============================================================
# 1. WORKFLOW TRIGGERS
# ============================================================
on:
  # Record pushes to important branches.
  push:
    branches:
      - main
      - master
      - release
      - 'feature/**'

  # Record pull request activity and merges.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

  # Record published releases.
  release:
    types:
      - published

  # Record completed CI workflows.
  # Add your exact deployment/Terraform workflow names here
  # when those workflows are created.
  workflow_run:
    workflows:
      - Python Hello World CI
    types:
      - completed

  # Record deployment status changes.
  deployment_status:

  # Permit manual execution.
  workflow_dispatch:

# ============================================================
# 2. PERMISSIONS
# ============================================================
permissions:
  actions: read
  contents: read
  pull-requests: read
  deployments: read

# ============================================================
# 3. AUDIT JOB
# ============================================================
jobs:
  audit:
    name: Generate Comprehensive Audit Record
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # 3.1 Download coverage evidence from the Python CI run.
      # This expects the CI workflow to upload an artifact named
      # python-coverage-report containing coverage.xml.
      # ------------------------------------------------------
      - name: Download Python CI coverage artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: python-coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ci-artifacts

      # ------------------------------------------------------
      # 3.2 Extract coverage percentage when coverage.xml exists.
      # ------------------------------------------------------
      - name: Extract coverage percentage
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          result = {
              "coverage_percentage": None,
              "coverage_source": None
          }

          for path in pathlib.Path("ci-artifacts").rglob("coverage.xml"):
              try:
                  root = ET.parse(path).getroot()
                  rate = root.attrib.get("line-rate")

                  if rate is not None:
                      result["coverage_percentage"] = round(
                          float(rate) * 100, 2
                      )
                      result["coverage_source"] = str(path)
                      break
              except (ET.ParseError, OSError, ValueError):
                  continue

          pathlib.Path("coverage-summary.json").write_text(
              json.dumps(result, indent=2) + "\n",
              encoding="utf-8"
          )

          print(json.dumps(result, indent=2))
          PY

      # ------------------------------------------------------
      # 3.3 Collect audit evidence from GitHub APIs and events.
      # ------------------------------------------------------
      - name: Collect audit evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const p = context.payload;
            const event = context.eventName;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const server = context.serverUrl;

            const run = p.workflow_run || null;
            const pr = p.pull_request || null;
            const release = p.release || null;

            const deployment =
              p.deployment ||
              p.deployment_status?.deployment ||
              null;

            const deploymentStatus = p.deployment_status || null;

            // Read coverage collected by the previous step.
            let coverage = {
              coverage_percentage: null,
              coverage_source: null
            };

            if (fs.existsSync('coverage-summary.json')) {
              try {
                coverage = JSON.parse(
                  fs.readFileSync('coverage-summary.json', 'utf8')
                );
              } catch (e) {
                core.warning(`Could not read coverage summary: ${e.message}`);
              }
            }

            // ------------------------------------------------
            // CODE CHANGES: push commits and pull request commits
            // ------------------------------------------------
            let commits = (p.commits || []).map(c => ({
              sha: c.id,
              message: c.message,
              author: c.author?.name || 'Unknown'
            }));

            if (pr?.number) {
              try {
                const result = await github.rest.pulls.listCommits({
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100
                });

                commits = result.data.map(c => ({
                  sha: c.sha,
                  message: c.commit.message,
                  author: c.author?.login ||
                    c.commit.author?.name || 'Unknown'
                }));
              } catch (e) {
                core.warning(`Could not retrieve PR commits: ${e.message}`);
              }
            }

            // ------------------------------------------------
            // RELEASE TRACEABILITY: resolve tag to commit SHA
            // ------------------------------------------------
            let releaseCommitSha = null;

            if (release?.tag_name) {
              try {
                const result = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: release.tag_name
                });

                releaseCommitSha = result.data.sha;
              } catch (e) {
                core.warning(`Could not resolve release tag: ${e.message}`);
              }
            }

            // ------------------------------------------------
            // WORKFLOW RESULTS: jobs, timestamps and failed steps
            // ------------------------------------------------
            let jobs = [];
            let artifacts = [];

            if (run?.id) {
              try {
                const result =
                  await github.rest.actions.listJobsForWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                    per_page: 100
                  });

                jobs = result.data.jobs.map(j => ({
                  job_name: j.name,
                  status: j.status,
                  conclusion: j.conclusion,
                  started_at: j.started_at,
                  completed_at: j.completed_at,
                  job_url: j.html_url,
                  failed_steps: (j.steps || [])
                    .filter(s =>
                      s.conclusion === 'failure' ||
                      s.conclusion === 'cancelled'
                    )
                    .map(s => ({
                      name: s.name,
                      conclusion: s.conclusion,
                      number: s.number
                    }))
                }));
              } catch (e) {
                core.warning(`Could not retrieve jobs: ${e.message}`);
              }

              try {
                const result =
                  await github.rest.actions.listWorkflowRunArtifacts({
                    owner,
                    repo,
                    run_id: run.id,
                    per_page: 100
                  });

                artifacts = result.data.artifacts.map(a => ({
                  name: a.name,
                  size_bytes: a.size_in_bytes,
                  expired: a.expired,
                  created_at: a.created_at
                }));
              } catch (e) {
                core.warning(`Could not retrieve artifacts: ${e.message}`);
              }
            }

            // Classify jobs using their configured names.
            const qualityJobs = jobs.filter(j =>
              /test|coverage|pylint|lint|quality|security|build/i
                .test(j.job_name)
            );

            const terraformJobs = jobs.filter(j =>
              /terraform.*(plan|apply)|(plan|apply).*terraform/i
                .test(j.job_name)
            );

            const failedJobs = jobs.filter(j =>
              j.conclusion === 'failure' ||
              j.conclusion === 'cancelled'
            );

            const failedSteps = jobs.flatMap(j =>
              j.failed_steps.map(s => ({
                job: j.job_name,
                job_url: j.job_url,
                step: s.name,
                conclusion: s.conclusion
              }))
            );

            // ------------------------------------------------
            // CODE CHANGE METADATA
            // ------------------------------------------------
            const branch =
              run?.head_branch ||
              pr?.head?.ref ||
              (p.ref || context.ref).replace('refs/heads/', '');

            const commitSha =
              run?.head_sha ||
              pr?.head?.sha ||
              p.after ||
              context.sha;

            const codeChanges = {
              branch,
              commit_sha: commitSha,
              before_sha: p.before || null,
              after_sha: p.after || null,
              commits,
              push_actor: p.pusher?.name || null,
              pull_request: pr ? {
                number: pr.number,
                title: pr.title,
                author: pr.user?.login || null,
                state: pr.state,
                merged: pr.merged,
                merged_at: pr.merged_at || null,
                merged_by: pr.merged_by?.login || null,
                merge_commit_sha: pr.merge_commit_sha || null,
                url: pr.html_url
              } : null
            };

            // ------------------------------------------------
            // DEPLOYMENT TRACKING
            // Region and artifact version must be supplied by
            // a deployment workflow; GitHub does not guarantee
            // those values in deployment event payloads.
            // ------------------------------------------------
            const deploymentRecord = deployment ? {
              deployment_id: deployment.id,
              environment: deployment.environment || null,
              ref: deployment.ref || null,
              commit_sha: deployment.sha || null,
              created_at: deployment.created_at || null,
              status: deploymentStatus?.state || null,
              status_updated_at: deploymentStatus?.updated_at || null,
              status_description: deploymentStatus?.description || null,
              status_creator: deploymentStatus?.creator?.login || null,
              region: null,
              artifact_version: null
            } : null;

            // ------------------------------------------------
            // TESTING, QUALITY GATES AND INFRASTRUCTURE
            // These job results are available only for the
            // monitored source workflow run.
            // ------------------------------------------------
            const testingAndQuality = {
              source_workflow: run?.name || null,
              overall_ci_result: run?.conclusion || null,
              jobs: qualityJobs,
              coverage_percentage: coverage.coverage_percentage,
              coverage_source: coverage.coverage_source,
              quality_gate_outcome:
                qualityJobs.length > 0
                  ? qualityJobs.map(j => ({
                      job: j.job_name,
                      conclusion: j.conclusion
                    }))
                  : null
            };

            const infrastructure = {
              terraform_jobs: terraformJobs,
              plan_result: null,
              apply_result: null,
              evidence_artifacts: artifacts.filter(a =>
                /terraform|plan|apply|deployment|evidence/i.test(a.name)
              ),
              note:
                'Actual plan/apply results require Terraform workflow outputs or artifacts.'
            };

            // ------------------------------------------------
            // FAILURE TRACKING
            // ------------------------------------------------
            const failures = {
              failed_or_cancelled_jobs: failedJobs,
              failed_or_cancelled_steps: failedSteps,
              detail_note:
                'Job links provide access to console logs. Full error messages are not automatically copied into this JSON record.'
            };

            // ------------------------------------------------
            // APPROVAL TRACKING
            // A deployment status creator is not necessarily
            // the person who approved a protected environment.
            // ------------------------------------------------
            const approvals = {
              environment: deployment?.environment || null,
              status_creator: deploymentStatus?.creator?.login || null,
              deployment_status: deploymentStatus?.state || null,
              approver: null,
              approval_timestamp: null,
              note:
                'Populate approver and approval timestamp from actual protected-environment approval evidence.'
            };

            // ------------------------------------------------
            // COMPLETE AUDIT RECORD
            // ------------------------------------------------
            const record = {
              recorded_at: new Date().toISOString(),
              repository: `${owner}/${repo}`,
              event,
              audit_actor: context.actor,

              code_changes: codeChanges,
              deployment: deploymentRecord,

              release: release ? {
                tag: release.tag_name,
                name: release.name,
                commit_sha: releaseCommitSha,
                target_commitish: release.target_commitish,
                artifact_version: release.tag_name,
                published_at: release.published_at,
                url: release.html_url,
                assets: (release.assets || []).map(a => ({
                  name: a.name,
                  size_bytes: a.size,
                  download_url: a.browser_download_url
                }))
              } : null,

              approvals,
              testing_and_quality: testingAndQuality,
              infrastructure,
              failures,

              workflow: {
                name: run?.name || context.workflow,
                run_id: run?.id || context.runId,
                url: run?.html_url ||
                  `${server}/${owner}/${repo}/actions/runs/${context.runId}`,
                status: run?.status || 'not-applicable',
                conclusion: run?.conclusion || 'not-provided',
                started_at: run?.run_started_at || null,
                updated_at: run?.updated_at || null,
                source_actor: run?.actor?.login || null,
                triggering_actor: run?.triggering_actor?.login || null
              },

              source_artifacts: artifacts
            };

            // Save machine-readable audit evidence.
            fs.writeFileSync(
              'audit-log.json',
              JSON.stringify(record, null, 2) + '\n'
            );

            // Create a readable GitHub Actions run summary.
            await core.summary
              .addHeading('GitHub Actions Audit Record')
              .addTable([
                [{data: 'Field', header: true},
                 {data: 'Value', header: true}],
                ['Repository', record.repository],
                ['Event', event],
                ['Audit actor', context.actor],
                ['Branch', branch || 'N/A'],
                ['Commit SHA', commitSha || 'N/A'],
                ['Pull request', pr?.number ?? 'N/A'],
                ['Merged', pr ? String(pr.merged) : 'N/A'],
                ['Release tag', release?.tag_name || 'N/A'],
                ['Release commit', releaseCommitSha || 'N/A'],
                ['Deployment environment',
                  deploymentRecord?.environment || 'N/A'],
                ['Deployment status',
                  deploymentRecord?.status || 'N/A'],
                ['Coverage percentage',
                  coverage.coverage_percentage == null
                    ? 'Not available'
                    : `${coverage.coverage_percentage}%`],
                ['Quality jobs', String(qualityJobs.length)],
                ['Terraform jobs', String(terraformJobs.length)],
                ['Failed/cancelled jobs', String(failedJobs.length)],
                ['Failed/cancelled steps', String(failedSteps.length)],
                ['Source artifacts', String(artifacts.length)],
                ['Recorded at (UTC)', record.recorded_at]
              ])
              .addHeading('Audit Evidence')
              .addCodeBlock(JSON.stringify({
                code_changes: codeChanges,
                deployment: deploymentRecord,
                release: record.release,
                approvals,
                testing_and_quality: testingAndQuality,
                infrastructure,
                failures
              }, null, 2), 'json')
              .write();

            core.info(`Audit record generated for ${event}.`);

      # ------------------------------------------------------
      # 3.4 Upload the audit record for later review.
      # ------------------------------------------------------
      - name: Upload audit log
        uses: actions/upload-artifact@v4
        with:
          name: audit-log-${{ github.run_id }}
          path: audit-log.json
          retention-days: 90
          
          if-no-files-found: error
