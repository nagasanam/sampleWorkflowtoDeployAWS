name: SNS GitHub Actions Trigger

on:
  repository_dispatch:
    types:
      - cloudwatch_alarm

permissions:
  contents: read
  id-token: write

env:
  TARGET_ENV: elc-online-aws-connect-sandbox/eulo/ccare

jobs:
  sns-trigger:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Display SNS event payload
      - name: Debug SNS Event Payload
        run: |
          echo "Event Name: $GITHUB_EVENT_NAME"
          echo "SNS CloudWatch Alarm Payload:"
          cat "$GITHUB_EVENT_PATH"

      # Resolve AWS configuration
      - name: Resolve AWS Configuration
        id: target
        shell: bash
        run: |
          set -euo pipefail

          jq -e --arg k "$TARGET_ENV" 'has($k)' environments.json >/dev/null

          jq -r --arg k "$TARGET_ENV" '
            .[$k] |
            "role_arn=\(.rw_role_arn)",
            "region=\(.region)",
            "account_id=\(.account_id)"
          ' environments.json >> "$GITHUB_OUTPUT"

      # AWS OIDC authentication
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.target.outputs.role_arn }}
          role-session-name: sns-trigger-${{ github.run_id }}
          aws-region: ${{ steps.target.outputs.region }}

      # Verify AWS identity
      - name: Verify AWS Identity
        env:
          EXPECTED_ACCOUNT: ${{ steps.target.outputs.account_id }}
        run: |
          set -euo pipefail

          ACTUAL_ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          echo "Expected Account: $EXPECTED_ACCOUNT"
          echo "Actual Account: $ACTUAL_ACCOUNT"

          if [ "$ACTUAL_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "AWS account verification failed!"
            exit 1
          fi

          echo "AWS OIDC authentication successful!"

      # Display CloudWatch alarm details received through SNS and Lambda
      - name: Display CloudWatch Alarm Details
        env:
          ALARM_NAME: ${{ github.event.client_payload.alarm_name }}
          ALARM_STATE: ${{ github.event.client_payload.alarm_state }}
          ALARM_REASON: ${{ github.event.client_payload.reason }}
        run: |
          set -euo pipefail

          echo "SNS Notification Received!"
          echo "Alarm Name: $ALARM_NAME"
          echo "Alarm State: $ALARM_STATE"
          echo "Reason: $ALARM_REASON"

          if [ -z "$ALARM_NAME" ] || [ -z "$ALARM_STATE" ]; then
            echo "Alarm details missing!"
            exit 1
          fi

      # Validate alarm state
      - name: Validate Alarm State
        if: github.event.client_payload.alarm_state == 'ALARM'
        run: |
          echo "CloudWatch Alarm is in ALARM state!"
          echo "SNS to Lambda to GitHub Actions integration successful!"
