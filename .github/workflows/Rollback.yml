name: CloudWatch Alarm Demo

on:
  push:
    branches:
      - main

  workflow_dispatch:

  # Receives CloudWatch alarm events through GitHub repository_dispatch.
  repository_dispatch:
    types:
      - cloudwatch_alarm

permissions:
  contents: read
  id-token: write

env:
  TARGET_ENV: elc-online-aws-connect-sandbox/eulo/ccare

jobs:
  alarm-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Feature Branch
        uses: actions/checkout@v4

      # Displays the event name and payload for debugging.
      - name: Debug GitHub Event Payload
        run: |
          echo "Event Name: $GITHUB_EVENT_NAME"
          echo "Complete GitHub Event Payload:"
          cat "$GITHUB_EVENT_PATH"

      # Reads AWS role, region, and account details from environments.json.
      - name: Resolve AWS Configuration
        id: target
        shell: bash
        run: |
          set -euo pipefail

          jq -e --arg k "$TARGET_ENV" 'has($k)' environments.json >/dev/null

          jq -r --arg k "$TARGET_ENV" '
            .[$k] |
            "role_arn=\(.rw_role_arn)",
            "region=\(.region)",
            "account_id=\(.account_id)"
          ' environments.json >> "$GITHUB_OUTPUT"

      # Authenticates GitHub Actions with AWS using OIDC.
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.target.outputs.role_arn }}
          role-session-name: cloudwatch-alarm-demo-${{ github.run_id }}
          aws-region: ${{ steps.target.outputs.region }}

      # Verifies that the authenticated AWS account matches the expected account.
      - name: Verify AWS Identity
        env:
          EXPECTED_ACCOUNT: ${{ steps.target.outputs.account_id }}
        run: |
          set -euo pipefail

          ACTUAL_ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          echo "Expected Account: $EXPECTED_ACCOUNT"
          echo "Actual Account: $ACTUAL_ACCOUNT"

          if [ "$ACTUAL_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "AWS account verification failed!"
            exit 1
          fi

          echo "AWS OIDC authentication successful!"

      # Fetches the latest alarm name and state directly from CloudWatch.
      - name: Fetch CloudWatch Alarm Details
        id: alarm
        env:
          AWS_REGION: ${{ steps.target.outputs.region }}
          ALARM_NAME: Demo-Automation-Alarm
        run: |
          set -euo pipefail

          echo "Fetching alarm details from CloudWatch..."

          ALARM_JSON=$(aws cloudwatch describe-alarms \
            --alarm-names "$ALARM_NAME" \
            --region "$AWS_REGION" \
            --output json)

          echo "$ALARM_JSON" | jq .

          FETCHED_NAME=$(echo "$ALARM_JSON" | jq -r '.MetricAlarms[0].AlarmName // empty')
          FETCHED_STATE=$(echo "$ALARM_JSON" | jq -r '.MetricAlarms[0].StateValue // empty')

          if [ -z "$FETCHED_NAME" ] || [ -z "$FETCHED_STATE" ]; then
            echo "Alarm details not found!"
            exit 1
          fi

          echo "alarm_name=$FETCHED_NAME" >> "$GITHUB_OUTPUT"
          echo "alarm_state=$FETCHED_STATE" >> "$GITHUB_OUTPUT"

          echo "Alarm Name: $FETCHED_NAME"
          echo "Alarm State: $FETCHED_STATE"

      # Displays the CloudWatch alarm information and current state.
      - name: Display CloudWatch Alarm Details
        env:
          ALARM_NAME: ${{ steps.alarm.outputs.alarm_name }}
          ALARM_STATE: ${{ steps.alarm.outputs.alarm_state }}
        run: |
          echo "CloudWatch Alarm Demo Workflow"
          echo "Trigger Event: ${{ github.event_name }}"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Alarm Name: $ALARM_NAME"
          echo "Alarm State: $ALARM_STATE"

          if [ "$ALARM_STATE" = "ALARM" ]; then
            echo "CloudWatch Alarm is in ALARM state!"
          else
            echo "Current CloudWatch Alarm State: $ALARM_STATE"
          fi
